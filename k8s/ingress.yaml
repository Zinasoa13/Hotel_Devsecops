apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hotel
  namespace: hotel
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: hotel.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hotel
                port:
                  number: 80